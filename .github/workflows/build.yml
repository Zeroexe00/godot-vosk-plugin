name: Build Godot GDExtension Plugin

on:
  push:
    branches: [release]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, x86_32, arm64, arm32]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo dnf -y install --setopt=install_weak_deps=False \
            bash binutils bzip2 curl file findutils gettext git make patch pkgconfig python3-pip unzip which xz dotnet-sdk-8.0
          pip install scons==4.8.1

      - name: Download Buildroot SDKs
        run: |
          cd $GITHUB_WORKSPACE
          case "${{ matrix.arch }}" in
            x86_64)
              SDK_URL="https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2"
              SDK_DIR="x86_64-godot-linux-gnu_sdk-buildroot"
              ;;
            x86_32)
              SDK_URL="https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/i686-godot-linux-gnu_sdk-buildroot.tar.bz2"
              SDK_DIR="i686-godot-linux-gnu_sdk-buildroot"
              ;;
            arm64)
              SDK_URL="https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/aarch64-godot-linux-gnu_sdk-buildroot.tar.bz2"
              SDK_DIR="aarch64-godot-linux-gnu_sdk-buildroot"
              ;;
            arm32)
              SDK_URL="https://github.com/godotengine/buildroot/releases/download/godot-2023.08.x-4/armv7-godot-linux-gnueabihf_sdk-buildroot.tar.bz2"
              SDK_DIR="armv7-godot-linux-gnueabihf_sdk-buildroot"
              ;;
            *)
              echo "Unsupported architecture: ${{ matrix.arch }}"
              exit 1
              ;;
          esac

          curl -LO "$SDK_URL"
          tar xf $(basename "$SDK_URL")
          rm -f $(basename "$SDK_URL")
          cd "$SDK_DIR"
          ./relocate-sdk.sh || true
          echo "SDK_DIR=$GITHUB_WORKSPACE/$SDK_DIR" >> $GITHUB_ENV

      - name: Set up environment variables manually
        run: |
          echo "Adding toolchain to PATH..."
          echo "$SDK_DIR/bin" >> $GITHUB_PATH
          echo "CC=$(basename $SDK_DIR | cut -d'-' -f1)-gcc" >> $GITHUB_ENV
          echo "CXX=$(basename $SDK_DIR | cut -d'-' -f1)-g++" >> $GITHUB_ENV
          echo "AR=$(basename $SDK_DIR | cut -d'-' -f1)-ar" >> $GITHUB_ENV
          echo "STRIP=$(basename $SDK_DIR | cut -d'-' -f1)-strip" >> $GITHUB_ENV

      - name: Build plugin
        run: |
          echo "Using compiler: $CC"
          $CC --version || true
          scons platform=linux target=template_release arch=${{ matrix.arch }}